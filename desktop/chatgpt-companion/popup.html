<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ANKITA ChatGPT Companion</title><link rel="stylesheet" href="popup.css"></head>
<body>
<main aria-busy="true">
  <header class="brand">
    <span class="companion-face" aria-hidden="true"><i></i><i></i></span>
    <div><h1>Ankita</h1><p>Chrome companion</p></div>
    <button id="refresh" class="icon-button" type="button" aria-label="Refresh connection" title="Refresh connection" disabled>
      <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><path d="M16 6.5A6.5 6.5 0 1 0 16.4 13M16 3v4h-4" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </button>
  </header>
  <section class="connection-status" data-tone="neutral" aria-labelledby="status-title">
    <div class="status-heading"><span class="status-dot" aria-hidden="true"></span><h2 id="status-title">Checking connection</h2></div>
    <output id="status" role="status" aria-live="polite">Finding ANKITA on this device…</output>
  </section>
  <button id="connect" class="primary" type="button" disabled>Connect to ANKITA</button>
  <section id="conversation" class="conversation" hidden>
    <label for="tabs">ChatGPT conversation</label>
    <select id="tabs" disabled><option value="">No conversation yet</option></select>
    <button id="bind" class="secondary" type="button" disabled>Use this chat</button>
  </section>
  <section id="sign-in-section" class="sign-in" hidden>
    <p>ANKITA is ready to use your Chrome sign-in.</p>
    <button id="sign-in-transfer" class="primary" type="button">Bring Chrome sign-in to ANKITA</button>
  </section>
  <p id="notice" class="notice" role="alert" hidden></p>
  <details class="advanced">
    <summary>Advanced setup</summary>
    <p>Only for an older ANKITA app that gives you a pairing link.</p>
    <label for="pairing">Local pairing URL</label>
    <input id="pairing" type="password" autocomplete="off" spellcheck="false" placeholder="Paste the private link from ANKITA">
    <button id="pair-connect" class="secondary" type="button">Connect with link</button>
  </details>
  <footer><span>Your ChatGPT account and limits apply.</span><button id="disconnect" class="text-button" type="button" hidden>Disconnect</button></footer>
</main>
<script type="module" src="popup.mjs"></script>
</body>
</html>
